# EdgeLink 使用严格的 key=value 配置；未知键和越界值会在启动时被拒绝。
gateway_id=gw-001
database=var/edgelink.db
socket=var/edgelink.sock

# MQTT 上报地址、业务 ACK 超时和最大在途窗口。
mqtt_host=127.0.0.1
mqtt_port=1883
mqtt_ack_timeout_ms=5000
mqtt_window=32
# 采集队列达到高水位时暂停新轮询，回落到低水位后恢复。
event_queue_capacity=1024
event_queue_high_watermark=768
event_queue_low_watermark=512
control_queue_capacity=128

# 数据库预算、文件系统保留空间和已确认历史保留时间（毫秒）。
storage_budget_bytes=1073741824
storage_reserve_bytes=16777216
history_retention_ms=86400000

# 设备格式：device=id,host,port,unit_id,poll_ms,timeout_ms
device=meter-01,127.0.0.1,1502,1,1000,1000

# 点位格式：point=device_id,全局唯一键,address,uint16|int16,scale,unit
point=meter-01,meter-01.voltage,0,uint16,0.1,V
point=meter-01,meter-01.current,1,uint16,0.01,A
point=meter-01,meter-01.temperature,2,int16,0.1,C
